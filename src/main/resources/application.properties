# =========================================================
# APPLICATION
# =========================================================
spring.application.name=library-manager
server.port=${PORT:8080}

# =========================================================
# DATASOURCE
# =========================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP
spring.datasource.hikari.pool-name=AnaquelPool
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=0

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# =========================================================
# FLYWAY
# =========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================================================
# LOGGING
# =========================================================
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.flywaydb=INFO

# =========================================================
# CORS
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState

# =========================================================
# SCHEDULING
# =========================================================
app.scheduling.zone=America/Argentina/Buenos_Aires
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=anaquel-scheduler-

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.refresh-expiration=70d

# =========================================================
# FRONTEND
# =========================================================
app.frontend-url=${FRONTEND_URL}

# =========================================================
# TIENDANUBE
# =========================================================
tiendanube.client-id=${TIENDA_NUBE_APP_ID}
tiendanube.client-secret=${TIENDA_NUBE_SECRET}
tiendanube.redirect-uri=${TIENDA_NUBE_REDIRECT_URI}
tiendanube.webhook-url=${TIENDANUBE_WEBHOOK_URL}
tiendanube.auth-url=https://www.tiendanube.com/apps
tiendanube.token-url=https://www.tiendanube.com/apps/authorize/token
tiendanube.api-url=https://api.tiendanube.com/v1
tiendanube.endpoints.products=/{storeId}/products
tiendanube.endpoints.product=/{storeId}/products/{productId}
tiendanube.endpoints.product-variant=/{storeId}/products/{productId}/variants/{variantId}
tiendanube.endpoints.product-images=/{storeId}/products/{productId}/images
tiendanube.endpoints.product-image=/{storeId}/products/{productId}/images/{imageId}
tiendanube.endpoints.products-page=/{storeId}/products?page={page}&per_page={perPage}
tiendanube.endpoints.orders=/{storeId}/orders/{orderId}
tiendanube.endpoints.webhooks=/{storeId}/webhooks

# =========================================================
# TIENDANUBE WORK SIGNALS
# =========================================================
# Tick en memoria: no consulta PostgreSQL cuando no hay trabajo.
tiendanube.work.tick-delay-ms=1000

# =========================================================
# TIENDANUBE JOBS
# =========================================================
tiendanube.jobs.enabled=true
tiendanube.jobs.initial-delay-ms=5000
tiendanube.jobs.batch-size=5
tiendanube.jobs.default-max-attempts=7
tiendanube.jobs.lease-duration=10m

# =========================================================
# TIENDANUBE WEBHOOK INBOX
# =========================================================
tiendanube.webhook-inbox.initial-delay-ms=3000
tiendanube.webhook-inbox.batch-size=20
tiendanube.webhook-inbox.lease-seconds=60
tiendanube.webhook-inbox.max-attempts=12
tiendanube.webhook-inbox.retry-base-seconds=30
tiendanube.webhook-inbox.retry-max-seconds=1800

# =========================================================
# TIENDANUBE BULK
# =========================================================
tiendanube.bulk.initial-delay-ms=3000
tiendanube.bulk.dispatch-batch-size=50

# =========================================================
# TIENDANUBE RECONCILIATION
# =========================================================
tiendanube.reconciliation.lease-seconds=600
tiendanube.reconciliation.claim-batch-size=4
tiendanube.reconciliation.worker-initial-delay-ms=5000
tiendanube.reconciliation.cron=0 30 7,19 * * *

# =========================================================
# TIENDANUBE WEBHOOK REGISTRATION
# =========================================================
tiendanube.webhook-registration.cron=0 30 4 * * *

# =========================================================
# MAINTENANCE JOBS
# =========================================================
auth.refresh-token-cleanup.cron=0 0 3 * * *
tiendanube.oauth-state-cleanup.cron=0 5 3 * * *
anaquel.metadata-enrichment.cron=0 15 3 * * *

# =========================================================
# PRICE LIST IMPORT
# =========================================================
app.price-import.progress-update-every-rows=${PROGRESS_UPDATE_ROWS}
app.price-import.batch-size=${IMPORT_PRICE_BATCH_SIZE}
app.price-import.isbn-query-batch-size=${ISBN_QUERY_BATCH_SIZE}
app.price-import.staging-batch-size=200
app.price-import.max-concurrent-imports=1
app.price-import.max-file-size=30MB
app.price-list.import.batch-size=100

# =========================================================
# PRICE LIST ANALYSIS
# =========================================================
app.price-list.analysis.max-file-size=30MB
app.price-list.analysis.max-file-size-bytes=31457280
app.price-list.analysis.max-preview-rows=30
app.price-list.analysis.max-columns=40
app.price-list.analysis.max-sheets=5

# =========================================================
# EDITORIAL PRICE HEALTH
# =========================================================
app.editorial-price.health.stale-days=${EDITORIAL_PRICE_STALE_DAYS:90}

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB

# =========================================================
# CLOUDINARY
# =========================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.root-folder=${CLOUDINARY_ROOT_FOLDER:anaquel}

# =========================================================
# MEDIA
# =========================================================
anaquel.media.max-file-size=5MB
anaquel.media.max-download-size=20MB
anaquel.media.allowed-content-types=image/jpeg,image/png,image/webp
anaquel.media.minimum-width=200
anaquel.media.minimum-height=300
anaquel.media.connect-timeout=10s
anaquel.media.read-timeout=20s

# =========================================================
# COVER PROCESSING
# =========================================================
anaquel.cover-processing.enabled=true
anaquel.cover-processing.batch-size=12
anaquel.cover-processing.parallelism=3
anaquel.cover-processing.max-attempts=4
anaquel.cover-processing.processing-timeout=15m
anaquel.cover-processing.cron=0 0 6 * * MON

# =========================================================
# EMAIL
# =========================================================
app.email.api-url=${MAILTRAP_API_URL:https://send.api.mailtrap.io/api/send}
app.email.api-token=${MAILTRAP_API_TOKEN}
app.email.from=${MAIL_FROM:no-reply@anaquel.com.ar}
app.email.from-name=${MAIL_FROM_NAME:Anaquel}
app.email.frontend-url=${FRONTEND_URL:https://anaquel.com.ar}
app.email.invitation-path=${INVITATION_PATH:/register}
app.email.password-reset-path=${PASSWORD_RESET_PATH:/reset-password}

# =========================================================
# AUTH
# =========================================================
auth.password-reset-expiration=30m
auth.invitation-expiration=48h

# =========================================================
# CACHE
# =========================================================
spring.cache.type=caffeine
spring.cache.cache-names=editorialPriceHealthSummary
spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=5m

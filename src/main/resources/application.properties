spring.application.name=library-manager

server.port=${PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.flywaydb=INFO

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

tiendanube.client-id=${TIENDA_NUBE_APP_ID}
tiendanube.client-secret=${TIENDA_NUBE_SECRET}
tiendanube.redirect-uri=${TIENDA_NUBE_REDIRECT_URI}
tiendanube.auth-url=https://www.tiendanube.com/apps
tiendanube.token-url=https://www.tiendanube.com/apps/authorize/token
tiendanube.api-url=https://api.tiendanube.com/v1

# Importación de listas de precio
app.price-import.progress-update-every-rows=${PROGRESS_UPDATE_ROWS}
app.price-import.batch-size=${IMPORT_PRICE_BATCH_SIZE}
app.price-import.isbn-query-batch-size=${ISBN_QUERY_BATCH_SIZE}
app.price-import.staging-batch-size=200
app.price-import.max-file-size=30MB
app.price-import.max-concurrent-imports=1

app.frontend-url=${FRONTEND_URL}

# Análisis de plantillas
app.price-list.analysis.max-file-size-bytes=31457280
app.price-list.analysis.max-preview-rows=30
app.price-list.analysis.max-columns=40
app.price-list.analysis.max-sheets=5
app.price-list.analysis.max-file-size=30MB

# Carga HTTP
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB

# Importación real
app.price-list.import.batch-size=100

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=6044800000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.root-folder=${CLOUDINARY_ROOT_FOLDER:anaquel}

anaquel.media.max-file-size=5MB
anaquel.media.max-download-size=20MB
anaquel.media.allowed-content-types=image/jpeg,image/png,image/webp
anaquel.media.minimum-width=200
anaquel.media.minimum-height=300
anaquel.media.connect-timeout=10s
anaquel.media.read-timeout=20s

anaquel.cover-processing.enabled=true
anaquel.cover-processing.batch-size=12
anaquel.cover-processing.parallelism=3
anaquel.cover-processing.max-attempts=4
anaquel.cover-processing.cron=0 0 3 * * MON
anaquel.cover-processing.processing-timeout=15m

app.email.api-url=${MAILTRAP_API_URL:https://send.api.mailtrap.io/api/send}
app.email.api-token=${MAILTRAP_API_TOKEN}
app.email.from=${MAIL_FROM:no-reply@anaquel.com.ar}
app.email.from-name=${MAIL_FROM_NAME:Anaquel}
app.email.frontend-url=${FRONTEND_URL:https://anaquel.com.ar}
app.email.invitation-path=${INVITATION_PATH:/registro}